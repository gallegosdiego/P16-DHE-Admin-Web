name: secret-scan

# Escaneo de credenciales en cada push y PR.
# Origen: ruta de remediacion P1.3. Motivo: un volcado de sesion de produccion
# (cookies.txt) llego a un repositorio publico y solo se detecto en auditoria.

on:
  # push y pull_request: gitleaks solo revisa los commits NUEVOS del evento.
  # Protege contra secretos entrantes, no detecta los ya presentes.
  push:
  pull_request:
  # schedule y workflow_dispatch: barrido COMPLETO del historial.
  # Este es el que encuentra lo que ya estaba dentro.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Buscar credenciales
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
