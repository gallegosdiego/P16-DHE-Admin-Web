    - /bin/mkdir -p /home/danheiex/api.danheiexpress.com/storage/logs
    - /bin/cp -R api/. /home/danheiex/api.danheiexpress.com/
    - cd /home/danheiex/api.danheiexpress.com && /usr/local/bin/php scripts/deploy-cpanel-all.php 2>&1
